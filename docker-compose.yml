services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: trilogis_adapter_test
      MYSQL_ROOT_PASSWORD: local
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "-h", "127.0.0.1", "-uroot", "-plocal", "trilogis_adapter_test", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql_data:
